<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wohnideen-Check</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f0ec;color:#333;font-family:Arial,Helvetica,sans-serif}header,footer{background:#fff;padding:16px 28px;border-bottom:1px solid #e4e1da;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}header img,footer img{height:54px}.wrap{max-width:1120px;margin:auto;padding:44px 22px 64px}.kicker{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#a67c2d;font-weight:700;margin-bottom:14px}h1,h2,.ctaTitle{font-family:Arial Black,Arial,sans-serif;color:#111}h1{font-size:clamp(32px,5vw,44px);line-height:1.05;margin:0 0 14px}.tag{font-size:clamp(18px,2.4vw,22px);font-weight:900;color:#a67c2d;margin-bottom:20px}.intro{font-size:17px;line-height:27px;max-width:760px}.room{margin-top:44px}.compare{position:relative;width:100%;overflow:hidden;background:#e7e4de;touch-action:none;user-select:none;cursor:ew-resize;box-shadow:0 18px 50px #00000014}.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}.top{clip-path:inset(0 50% 0 0)}.line{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;transform:translateX(-50%);box-shadow:0 0 14px #0007}.handle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#111;font-size:20px;font-weight:900;box-shadow:0 10px 30px #0006}.badge{position:absolute;top:14px;padding:8px 12px;background:#fff;color:#111;font-size:11px;font-weight:900;letter-spacing:2px;box-shadow:0 4px 14px #0002}.left{left:14px}.right{right:14px;background:#a67c2d;color:#fff}.cta{margin-top:52px;background:#fff;padding:32px;box-shadow:0 18px 50px #00000010}.ctaTitle{font-size:26px;margin-bottom:12px}.gold{color:#a67c2d}.btn{display:inline-block;background:#a67c2d;color:#fff;padding:16px 26px;font-weight:900;font-size:13px;letter-spacing:2px;text-transform:uppercase;text-decoration:none}.legal{margin-top:26px;padding-top:16px;border-top:1px solid #e0ddd6;color:#999;font-size:12px;line-height:20px}.error{background:#fff;border-left:4px solid #a67c2d;padding:20px}</style></head><body><header><img src="assets/logo-hasbargen.png" alt="Immobilien Contor Hasbargen"><div style="font-size:12px;font-weight:700;letter-spacing:3px">KAISERBÄDER I <span class="gold">USEDOM</span></div></header><main class="wrap"><div class="kicker">Wohnideen-Check</div><div id="app"><div class="error">Wohnideen werden geladen …</div></div></main><footer><div><img src="assets/logo-hasbargen.png" alt="Immobilien Contor Hasbargen"><div>Seestraße 16 · 17429 Ostseebad Heringsdorf / OT Bansin<br>+49 38378 80888 · info@immobilien-kaiserbaeder.de</div></div><div style="color:#999;font-size:12px">Drei Jahrzehnte Usedom. Lokal. Direkt. Und anders.</div></footer><script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function activate(){document.querySelectorAll('.compare').forEach(c=>{c.onpointerdown=e=>{const set=x=>{const r=c.getBoundingClientRect(),p=Math.max(0,Math.min(100,(x-r.left)/r.width*100));c.querySelector('.top').style.clipPath=`inset(0 ${100-p}% 0 0)`;c.querySelector('.line').style.left=p+'%';c.querySelector('.handle').style.left=p+'%'};set(e.clientX);const mv=e=>set(e.clientX),up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up)};window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up)}})}
async function load(){try{const q=new URLSearchParams(location.search),src=q.get('s'),d=q.get('d');let p;if(src){const r=await fetch(src);if(!r.ok)throw new Error('Daten nicht gefunden');p=await r.json()}else if(d){p=JSON.parse(decodeURIComponent(escape(atob(d))))}else throw new Error('Kein Wohnideen-Link übergeben');document.title=(p.objectName||'Wohnideen')+' – Wohnideen-Check';const rooms=(p.rooms||[]).map((r,i)=>`<section class="room"><h2>${esc(r.name||'Raum '+(i+1))}</h2><div class="compare" style="aspect-ratio:${Number(r.ratio)||16/9}"><img src="${esc(r.after)}" alt="Wohnidee"><img class="top" src="${esc(r.before)}" alt="Heute"><div class="line"></div><div class="handle">↔</div><div class="badge left">HEUTE</div><div class="badge right">WOHNIDEE</div></div></section>`).join('');const name=esc(p.objectName||'Wohnideen-Check');document.getElementById('app').innerHTML=`<h1>${name}</h1><div class="tag">${esc(p.tagline)}</div><p class="intro">${esc(p.intro)}</p>${rooms}<div class="cta"><div class="kicker">Nächster Schritt</div><div class="ctaTitle">Am Bildschirm ist es schön. Vor Ort <span class="gold">entscheidet es sich</span>.</div><p>Die Wohnideen haben dich neugierig gemacht? Dann zeigen wir dir gern mehr von der Immobilie.</p><a class="btn" href="mailto:info@immobilien-kaiserbaeder.de?subject=${encodeURIComponent((p.objectName||'Immobilie')+' | Die Wohnideen haben mich neugierig gemacht')}">Zeig mir mehr ★</a><div style="margin-top:14px;color:#777;font-size:13px">Keine Sorge – ein Klick ist noch kein Kaufvertrag. 😉</div></div><div class="legal">KI-Visualisierung zur Inspiration. Unter „HEUTE“ siehst du immer den tatsächlichen Zustand der Wohnung. Die Darstellung unter „WOHNIDEE“ ist eine unverbindliche Gestaltungsidee – keine Zusicherung von Ausstattung, Material oder Bauzustand.</div>`;activate()}catch(e){document.getElementById('app').innerHTML='<div class="error">Dieser Wohnideen-Link konnte nicht geladen werden. Bitte fordere einen neuen Link an.</div>'}}
load();
</script></body></html>
