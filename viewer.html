<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wohnideen-Check</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f3ef;color:#141414}.w{max-width:1180px;margin:auto;padding:28px 18px 60px}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 14px 42px #00000012}.k{font-size:14px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#666}h1{font-size:clamp(34px,5vw,58px);margin:8px 0}.tag{font-size:clamp(19px,2.5vw,28px);font-weight:800;margin-bottom:14px}.intro{color:#505050;max-width:860px;font-size:17px;line-height:1.55}.room{margin-top:28px}.room h2{font-size:24px}.cmp{position:relative;width:100%;overflow:hidden;border-radius:20px;background:#ddd;touch-action:none;user-select:none}.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}.cmp img.top{clip-path:inset(0 50% 0 0)}.line{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;transform:translateX(-50%);box-shadow:0 0 12px #0006}.handle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:25px;font-weight:900;box-shadow:0 8px 28px #0006}.badge{position:absolute;top:14px;padding:9px 12px;border-radius:999px;background:#0009;color:#fff;font-size:12px;font-weight:900}.left{left:14px}.right{right:14px}.disc{margin-top:22px;padding-top:16px;border-top:1px solid #e6e6e0;color:#777;font-size:13px;line-height:1.45}@media(max-width:760px){.w{padding:16px 10px}.card{padding:16px}.handle{width:56px;height:56px}}</style></head><body><main class="w"><section class="card" id="root">Wohnideen-Check wird geladen …</section></main><script>function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}function wire(c){let t=c.querySelector('.top'),l=c.querySelector('.line'),h=c.querySelector('.handle'),drag=false;function set(x){let r=c.getBoundingClientRect(),p=Math.max(0,Math.min(100,(x-r.left)/r.width*100));t.style.clipPath=`inset(0 ${100-p}% 0 0)`;l.style.left=h.style.left=p+'%'}c.onpointerdown=e=>{drag=true;c.setPointerCapture(e.pointerId);set(e.clientX)};c.onpointermove=e=>{if(drag)set(e.clientX)};c.onpointerup=()=>drag=false}try{let d=new URLSearchParams(location.search).get('d');if(!d)throw 0;let p=JSON.parse(decodeURIComponent(escape(atob(d)))),root=document.getElementById('root');document.title='Wohnideen-Check – '+p.objectName;root.innerHTML=`<div class="k">Wohnideen-Check</div><h1>${esc(p.objectName)}</h1><div class="tag">${esc(p.tagline)}</div><p class="intro">${esc(p.intro)}</p><div id="rooms"></div><div class="disc">KI-Visualisierung zur Inspiration. Unter „HEUTE“ siehst du immer den tatsächlichen Zustand der Wohnung. Die Darstellung unter „WOHNIDEE“ ist eine unverbindliche Gestaltungsidee.</div>`;let H=document.getElementById('rooms');p.rooms.forEach((r,i)=>{let s=document.createElement('section');s.className='room';s.innerHTML=`<h2>${esc(r.name||('Raum '+(i+1)))}</h2><div class="cmp" style="aspect-ratio:${Number(r.ratio)||16/9}"><img src="${r.after}"><img src="${r.before}" class="top"><div class="line"></div><div class="handle">↔</div><div class="badge left">HEUTE</div><div class="badge right">WOHNIDEE</div></div>`;H.appendChild(s);wire(s.querySelector('.cmp'))})}catch(e){document.getElementById('root').innerHTML='Dieser Wohnideen-Check konnte nicht geladen werden.'}</script></body></html>
