<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wohnideen-Check – Generator</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f3ef;color:#141414}.w{max-width:1180px;margin:auto;padding:28px 18px 60px}h1{font-size:clamp(38px,6vw,72px);line-height:.95;margin:0 0 10px}.lead{color:#686868;font-size:18px}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 14px 42px #00000012;margin-top:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:800;margin:0 0 7px}input,textarea{width:100%;padding:12px 14px;border:1px solid #deded8;border-radius:12px;background:#fff;font:inherit}textarea{min-height:90px}button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;font:inherit}.p{background:#111;color:#fff}.s{background:#ecece7}.d{background:#f3e6e6;color:#7a2020}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.room{border:1px solid #deded8;border-radius:18px;padding:18px;margin-top:16px}.rh{display:flex;justify-content:space-between;align-items:center}.status{margin-top:14px;color:#555}.link{display:none;margin-top:16px}.small{font-size:13px;color:#686868}@media(max-width:760px){.grid{grid-template-columns:1fr}.w{padding:16px 10px 40px}}</style></head><body><main class="w"><h1>Wohnideen-Check</h1><p class="lead">Dein interner Generator: Objekt anlegen, Räume hinzufügen und einen öffentlichen Kundenlink erzeugen.</p><section class="card"><div class="grid"><div><label>Objektname</label><input id="obj" value="Villa Luna 13"></div><div><label>Unterzeile</label><input id="tag" value="Nicht schöner fotografiert. Einfach mal weitergedacht."></div></div><div style="margin-top:16px"><label>Einleitung für den Kunden</label><textarea id="intro">Wir zeigen dir bewusst beides: wie die Wohnung heute wirklich aussieht – und was mit ein paar frischen Wohnideen daraus werden könnte. Schieb den Regler einfach hin und her und probier's aus.</textarea></div><div id="rooms"></div><div class="actions"><button class="s" id="add">+ Raum hinzufügen</button><button class="p" id="make">Kundenlink erstellen</button></div><div class="status" id="status"></div><div class="link" id="link"><label>Öffentlicher Kundenlink</label><input id="url" readonly><div class="actions"><button class="s" id="copy">Link kopieren</button><button class="s" id="open">Kundenansicht öffnen</button></div></div><p class="small">Der Kunde sieht nur die fertige Kundenansicht – niemals diesen Generator.</p></section></main><script>const R=document.getElementById('rooms'),S=document.getElementById('status'),L=document.getElementById('link'),U=document.getElementById('url');let rooms=[],n=0;function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}function ratio(f){return new Promise((ok,no)=>{let u=URL.createObjectURL(f),i=new Image;i.onload=()=>{let r=i.naturalWidth/i.naturalHeight;URL.revokeObjectURL(u);ok(r)};i.onerror=no;i.src=u})}function add(name='Wohnzimmer'){n++;let r={id:n,name,b:null,a:null,ratio:16/9};rooms.push(r);let d=document.createElement('div');d.className='room';d.innerHTML=`<div class="rh"><h3>Raum ${r.id}</h3><button class="d">Entfernen</button></div><div class="grid"><div><label>Raumname</label><input class="name" value="${esc(name)}"></div><div></div><div><label>HEUTE</label><input class="b" type="file" accept="image/*"></div><div><label>WOHNIDEE</label><input class="a" type="file" accept="image/*"></div></div>`;R.appendChild(d);d.querySelector('.name').oninput=e=>r.name=e.target.value;d.querySelector('.b').onchange=async e=>{r.b=e.target.files[0]||null;if(r.b)r.ratio=await ratio(r.b)};d.querySelector('.a').onchange=e=>r.a=e.target.files[0]||null;d.querySelector('.d').onclick=()=>{rooms=rooms.filter(x=>x.id!==r.id);d.remove()}}async function up(f){let q=await fetch('/api/upload?filename='+encodeURIComponent(f.name),{method:'POST',headers:{'content-type':f.type||'application/octet-stream'},body:f});if(!q.ok)throw new Error(await q.text()||'Upload fehlgeschlagen');return q.json()}document.getElementById('add').onclick=()=>add('Weiterer Raum');document.getElementById('make').onclick=async()=>{let c=rooms.filter(r=>r.b&&r.a);if(!c.length){S.textContent='Bitte mindestens einen Raum vollständig anlegen.';return}try{document.getElementById('make').disabled=true;let out=[];for(let i=0;i<c.length;i++){S.textContent=`Raum ${i+1} von ${c.length} wird hochgeladen …`;let [b,a]=await Promise.all([up(c[i].b),up(c[i].a)]);out.push({name:c[i].name,before:b.url,after:a.url,ratio:c[i].ratio})}let p={objectName:obj.value||'Wohnideen-Check',tagline:tag.value||'',intro:intro.value||'',rooms:out};let e=btoa(unescape(encodeURIComponent(JSON.stringify(p))));U.value=location.origin+'/viewer.html?d='+encodeURIComponent(e);L.style.display='block';S.textContent='Fertig – der Kundenlink ist öffentlich erreichbar.'}catch(e){S.textContent='Fehler: '+e.message}finally{document.getElementById('make').disabled=false}};document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(U.value);S.textContent='Link kopiert.'};document.getElementById('open').onclick=()=>window.open(U.value,'_blank');add();</script></body></html>
